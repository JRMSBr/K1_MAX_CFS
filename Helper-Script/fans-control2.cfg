########################################
# Fans Control
########################################

[respond]

[duplicate_pin_override]
pins: PC5, PB2, PC6, ADC_TEMPERATURE, PB10


[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: pid
pid_kp: 45
pid_ki: 0
pid_kd: 35
pid_deriv_time: 4
target_temp: 40.0
max_speed: 0.7
min_speed: 0.0
gcode_id: chamber_fan


[temperature_fan soc_fan]
pin: PB2
cycle_time: 0.0100
kick_start_time: 0.5
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
control: watermark
max_delta: 2
target_temp: 45.0
max_speed: 1.0
min_speed: 0.0
tachometer_pin:PC6


[gcode_macro M141]
description: Set Chamber Temperature with slicers
gcode:
  {% if 'S' in params|upper %}
    {% if params.S|int > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={params.S|default(34)}
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=34
    {% endif %}
  {% endif %}


