#rename_existing: FILAMENT_RACK_MODIFY_ORIGINAL
gcode:

[gcode_macro BED_TEMP_MEMORY]
variable_last_bed_temp: 0
gcode:                     ; memória da temperatura da mesa

[gcode_macro RESET_BSCREEN]
gcode:
    RUN_SHELL_COMMAND CMD=reset_fb
    G4 P500  ; aguarda 500ms


[gcode_shell_command reset_fb]
command: sh -c "killall -9 display-server; sleep 0.5; nohup /usr/bin/display-server > /dev/null 2>&1 &"
timeout: 5
verbose: False

