[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=60
  SAVE_CONFIG

[gcode_macro HOTENDPID]
gcode:
  PID_CALIBRATE HEATER=extruder TARGET=220
  SAVE_CONFIG

[gcode_macro TUNOFFINPUTSHAPER]
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    {% if printer['gcode_macro PRINTER_PARAM'].hotend_temp|int != 0 %}
    {% if printer['gcode_macro PRINTER_PARAM'].hotend_temp|int > printer.extruder.temperature %}
      M109 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
    {% else %}
      M104 S{printer['gcode_macro PRINTER_PARAM'].hotend_temp|int}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0
  {% endif %}
  {% if printer['gcode_macro PRINTER_PARAM'].fan2_speed > 0 %}
    # {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
    # {action_respond_info("fan2_value2 = %s \n" % (fspeed))}
    # SET_PIN PIN=fan2 VALUE={(printer['gcode_macro PRINTER_PARAM'].fan2_speed * 255 + 0.5)|int}
    {% set s_value = (printer['gcode_macro PRINTER_PARAM'].fan2_speed * 255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) * 255 / (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min)|float %}
    M106 P2 S{s_value}
  {% endif %}

  # Y轴移动到安全位置，避免Z轴升降碰撞
  {% set safe_pos_y = printer.configfile.settings['box'].safe_pos_y %}
  {% set cur_y = printer.toolhead.position.y|float %}
  {action_respond_info("safe_pos_y = %f "% (safe_pos_y))}
  {action_respond_info("cur_y = %f" % (cur_y))}
  {% if cur_y > safe_pos_y %}
    G0 Y{safe_pos_y}
    M400
  {% endif %}

  {% set z_resume_move = printer['gcode_macro PRINTER_PARAM'].z_safe_pause|int %}
  {% if z_resume_move > 2 %}
    {% set z_resume_move = z_resume_move - 2 %}
    G91
    G1 Z-{z_resume_move} F600
    M400
  {% endif %}
  {action_respond_info("z_resume_move = %s"% (z_resume_move))}
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float + 1.0 %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' and printer.box.enable|int != 1 %}
    G91
    G1 E{E} F2100
    G90
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  M400
  RESUME_BASE {get_params}
  BOX_ERROR_CLEAR
  BOX_ENABLE_CFS_PRINT ENABLE=1
  #RESTORE_E_CURRENT
  BOX_RESUME_EXTRUDE

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  HI_CURRENT
  END_PRINT_NO_M84
  CANCEL_PRINT_BASE

[gcode_macro G29]
gcode:
  {% if 'PROBE_COUNT' in params|upper %}
    {% set get_count = ('PROBE_COUNT' + params.PROBE_COUNT) %}
  {%else %}
    {% set get_count = "" %}
  {% endif %}

  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set nozzle_clear_temp = printer.custom_macro.default_extruder_temp %}

  {% if 'BED_TEMP' in params|upper %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper %}
    {% set nozzle_clear_temp = params.EXTRUDER_TEMP %}
  {% endif %}
  #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0

  G28
  BED_MESH_CLEAR
  NOZZLE_CLEAR HOT_MIN_TEMP={extruder_temp} HOT_MAX_TEMP={nozzle_clear_temp} BED_MAX_TEMP={bed_temp}
  ACCURATE_G28
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  BED_MESH_CALIBRATE {get_count}
  BED_MESH_OUTPUT
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  G1 X{x_park} Y{y_park} F2000
  CXSAVE_CONFIG
  TURN_OFF_HEATERS
  #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  #SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1


[gcode_macro IF_NEED_HOME]
gcode:
  {% set x_axes = printer.toolhead.homed_axes %}
  {% if x_axes is defined and x_axes[0] is defined %}
    {action_respond_info(
        "x_axes: %s \n"
        % (x_axes))}
  {% else %}
    G28
  {% endif %}

[gcode_macro HI_CURRENT]
gcode:
  {% if printer['output_pin HCDP'].value == 0 %}
    RESPOND PREFIX="INFO" MSG="High current Enabled"
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.5
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.5
   {% else %}
    RESPOND PREFIX="INFO" MSG="High current Enabled"
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.5
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.5
   {% endif %}
  
[gcode_macro LO_CURRENT]
gcode:
  {% if printer['output_pin HCDP'].value == 0 %}
    RESPOND PREFIX="INFO" MSG="High current during printing Disabled"
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1
   {% else %}
    RESPOND PREFIX="INFO" MSG="High current during printing Enabled"
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.5
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.5
   {% endif %}

[gcode_macro PURGE_BLOB]
gcode:
    G92 E0                          ; zero the extruder
    G90                             ; absolute positioning
    G1 Y290 F18000                  ; Go to start pos for perge line
    G1 X68  F18000                  ; Go to start pos for perge line
    G1 X68 Y306 Z1 F18000           ; Go to start pos for perge line
    G1 Z0.4 F600                    ; Lower to purge height
    G91                             ; relative positioning
    G1 X40 E20 F100                 ; Extrude blob of filament on the bed
    G1 X5 Z5 F1000                  ; Slow drag away from the blob with fans helping cool and break strings. Also raiz z zo the blob clears the fan duct
    G92 E0                          ; zero the extruder
    G90                             ; absolute positioning

[delayed_gcode BMON]
initial_duration: 5
gcode:
  SET_PIN PIN=LEVEL_MODE VALUE=1.00
  SET_PIN PIN=LEVEL VALUE=1.00
  SET_PIN PIN=CUTTER VALUE=1.00
  RESPOND PREFIX="INFO" MSG="SEGURANCA: se nenhum Mesh estiver disponivel, um novo sera feito independentemente das chaves."
  RESPOND PREFIX="INFO" MSG="LEVEL ON = novo Mesh | LEVEL OFF = reutiliza o Mesh salvo."
  RESPOND PREFIX="INFO" MSG="LEVEL_MODE OFF = MANUAL: a chave LEVEL decide se um novo Mesh sera feito."
  RESPOND PREFIX="INFO" MSG="LEVEL_MODE ON = AUTOMATICO: refaz o Mesh somente se a temperatura da mesa mudar."

