[gcode_macro M107]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% if params.P is defined and params.P|int in [1, 3] %}
    { action_respond_info("M107 P" ~ params.P|string ~ " ignorado: exaustor em modo automatico") }
  {% else %}
    {% if params.P is defined %}
      {% if params.P|int < fans %}
        SET_PIN PIN=fan{params.P|int} VALUE=0
      {% else %}
        SET_PIN PIN=fan0 VALUE=0
      {% endif %}
    {% else %}
      SET_PIN PIN=fan0 VALUE=0
      SET_PIN PIN=fan2 VALUE=0
    {% endif %}
  {% endif %}

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[delayed_gcode wait_temp]
# initial_duration: 2.
gcode:
  {% set cur_temp = printer.extruder.temperature %}
  {% if cur_temp|int < 40 %}
    WAIT_TEMP_END
  {% else %}
    UPDATE_DELAYED_GCODE ID=wait_temp DURATION=5
  {% endif %}

[gcode_macro WAIT_TEMP_START]
gcode:
  {action_respond_info("wait temp start\n")}
  UPDATE_DELAYED_GCODE ID=wait_temp DURATION=1
  M106 P0 S153.00
  # M106 P2 S255

[gcode_macro WAIT_TEMP_END]
gcode:
  {action_respond_info("wait temp end\n")}
  UPDATE_DELAYED_GCODE ID=wait_temp DURATION=0
  M106 P0 S0
  #SET_PIN PIN=fan1 VALUE=0
  SET_PIN PIN=LED VALUE=0
  SET_PIN PIN=LEDBAR VALUE=0
  M141 S65
  # M106 P2 S0

[gcode_macro PRINT_CALIBRATION]
# This part of the command is replaced by the application side without passing parameters
gcode:
  CX_PRINT_LEVELING_CALIBRATION

[gcode_macro FIRST_FLOOR_PAUSE_POSITION]
gcode:
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  M104 S{extruder_temp}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer['gcode_macro PRINTER_PARAM'].max_x_position|float + 1 %}
  G90
  G1 Z2 F600
  G1 X{x_park} Y{y_park} F6000
  G1 Z0.2 F600

[gcode_macro ACCURATE_G28]
gcode:
  ACCURATE_HOME_Z

[gcode_macro START_PRINT]
variable_prepare: 0
gcode:
  BOX_START_PRINT
  G90
  HI_CURRENT
  WAIT_TEMP_END
  SET_PIN PIN=LEDBAR VALUE=1
  SET_PIN PIN=LED VALUE=1
  CLEAR_PAUSE

  {% set g28_extruder_temp = printer.custom_macro.g28_ext_temp %}
  {% set bed_temp = printer.custom_macro.default_bed_temp %}
  {% set extruder_temp = printer.custom_macro.default_extruder_temp %}
  {% set material = params.MATERIAL|default("PLA")|upper %}

  {% if material == "ABS" %}
        M141 S60
  {% elif material == "TPU" %}
        M141 S40
  {% elif material == "PLA" %}
        M141 S32
  {% elif material == "PETG" %}
        M141 S38
  {% else %}
        M141 S30
  {% endif %}

  {% if 'BED_TEMP' in params|upper and (params.BED_TEMP|float) %}
    {% set bed_temp = params.BED_TEMP %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params|upper and (params.EXTRUDER_TEMP|float) %}
    {% set extruder_temp = params.EXTRUDER_TEMP %}
  {% endif %}

  # ============================================================
  # DECISAO PRELIMINAR DO BED MESH
  #
  # LEVEL_MODE = 0 -> MANUAL
  # LEVEL_MODE = 1 -> AUTOMATICO
  #
  # LEVEL somente e usado no modo MANUAL.
  # ============================================================

  {% set last_bed_temp = printer["gcode_macro BED_TEMP_MEMORY"].last_bed_temp|float %}
  {% set current_bed_temp = bed_temp|float %}
  {% set auto_needs_mesh = 0 %}

  {% if printer['output_pin LEVEL_MODE'].value == 1 %}
      RESPOND PREFIX="INFO" MSG="Bed Mesh: modo AUTOMATICO"
      {% if current_bed_temp != last_bed_temp %}
          {% set auto_needs_mesh = 1 %}
          RESPOND PREFIX="INFO" MSG="Temperatura da mesa mudou de {last_bed_temp}C para {current_bed_temp}C"
      {% else %}
          RESPOND PREFIX="INFO" MSG="Temperatura da mesa permanece em {current_bed_temp}C"
      {% endif %}

  {% else %}
      RESPOND PREFIX="INFO" MSG="Bed Mesh: modo MANUAL"
      {% if printer['output_pin LEVEL'].value == 1 %}
          RESPOND PREFIX="INFO" MSG="Chave manual solicita novo Bed Mesh"
      {% else %}
          RESPOND PREFIX="INFO" MSG="Chave manual solicita reutilizar Bed Mesh"
      {% endif %}
  {% endif %}

  {% if printer['gcode_macro START_PRINT'].prepare|int == 0 %}
    {action_respond_info("not prepare.\n")}
    PRINT_PREPARE_CLEAR
    CX_ROUGH_G28 EXTRUDER_TEMP={extruder_temp} BED_TEMP={bed_temp}
    FLOCK STATE=ON
    CX_NOZZLE_CLEAR
    FLOCK STATE=OFF
    ACCURATE_G28

    START_PRINT_MESH_CHECK BED_TEMP={current_bed_temp} AUTO_NEEDS_MESH={auto_needs_mesh}
  {% else %}
    PRINT_PREPARE_CLEAR
  {% endif %}

[gcode_macro START_PRINT_MESH_CHECK]
gcode:

  {% set current_bed_temp = params.BED_TEMP|float %}
  {% set auto_needs_mesh = params.AUTO_NEEDS_MESH|int %}

  {% set automatic_mode = printer['output_pin LEVEL_MODE'].value|int %}
  {% set manual_mesh = printer['output_pin LEVEL'].value|int %}

  {% set do_mesh = 0 %}

  # ============================================================
  # SEGURANCA
  #
  # Se depois do homing nao existir nenhum mesh carregado,
  # um novo mesh e obrigatorio independentemente das chaves.
  # ============================================================

  {% if not printer['bed_mesh'].profile_name %}
      RESPOND PREFIX="INFO" MSG="SEGURANCA: nenhum Bed Mesh encontrado. Novo mesh obrigatorio."
      {% set do_mesh = 1 %}

  # ============================================================
  # MODO AUTOMATICO
  # ============================================================

  {% elif automatic_mode == 1 %}
      {% if auto_needs_mesh == 1 %}
          RESPOND PREFIX="INFO" MSG="AUTOMATICO: temperatura mudou. Novo Bed Mesh sera realizado."
          {% set do_mesh = 1 %}

      {% else %}
          RESPOND PREFIX="INFO" MSG="AUTOMATICO: temperatura igual. Reutilizando Bed Mesh."
      {% endif %}

  # ============================================================
  # MODO MANUAL
  # ============================================================

  {% else %}
      {% if manual_mesh == 1 %}
          RESPOND PREFIX="INFO" MSG="MANUAL: chave LEVEL ligada. Novo Bed Mesh sera realizado."
          {% set do_mesh = 1 %}
      {% else %}
          RESPOND PREFIX="INFO" MSG="MANUAL: chave LEVEL desligada. Reutilizando Bed Mesh."
      {% endif %}
  {% endif %}

  # ============================================================
  # EXECUCAO
  # ============================================================

  {% if do_mesh == 1 %}
      RESPOND PREFIX="INFO" MSG="Starting Full Bed Mesh..."
      CX_PRINT_LEVELING_CALIBRATION
      # A memoria somente e atualizada se realmente fizermos
      # um novo Bed Mesh.
      SET_GCODE_VARIABLE MACRO=BED_TEMP_MEMORY VARIABLE=last_bed_temp VALUE={current_bed_temp}
  {% endif %}

  BED_MESH_PROFILE LOAD=default

[gcode_macro PRINT_PREPARED]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=1
  {action_respond_info("print prepared")}

[gcode_macro PRINT_PREPARE_CLEAR]
gcode:
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=prepare VALUE=0

[gcode_macro END_PRINT_POINT_WITHOUT_LIFTING]
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z2.0 F600
    G90
    {% set y_park = printer.toolhead.axis_maximum.y/2 %}
    {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro END_PRINT_POINT]
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
    G90
    G1 Z{max_z} F600
    BOX_MOVE_TO_SAFE_POS
  {% else %}
    {action_respond_info("end print xyz_axes is NULL\n")}
  {% endif %}

[gcode_macro END_PRINT]
gcode:
  M400
  M104 S200
  G28 Y
  G28 X
  BOX_PRE_CUT_RETRUDE
  END_PRINT_NO_M84
  M84
  SET_PIN PIN=LEDBAR VALUE=0.00

[gcode_macro END_PRINT_NO_M84]
gcode:
  M220 S100
  {% if printer['output_pin CUTTER'].value == 1 %}
        RESPOND PREFIX="INFO" MSG="Cutter Enabled"
        BOX_END
        SAVE_VARIABLE VARIABLE=currentcfsslot VALUE='"None"'
        {% endif %}
  BOX_END_PRINT
  TURN_OFF_HEATERS
  Qmode_exit
  QmodeFAN_exit
  EXCLUDE_OBJECT_RESET
  PRINT_PREPARE_CLEAR
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500
  #M107 P1
  M107 P2
  END_PRINT_POINT
  HI_CURRENT
  WAIT_TEMP_START
  BOX_GET_FIVE_WAY_STATE

[gcode_macro FIRST_FLOOR_PAUSE]
description: Pause the first floor print
# change this if you need more or less extrusion
variable_extrude: 2.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 0.0 %}
  {% if act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% elif act_z < max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
  PAUSE_BASE
  G91
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z{z_safe} F600
    G90
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
  # save fan2 value and turn off fan2
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan2_speed VALUE={printer['output_pin fan2'].value}
  {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
  {action_respond_info("fan2_value = %s \n" % (fspeed))}
  # SET_PIN PIN=fan2 VALUE=0
  M106 P2 S0
  SET_E_MIN_CURRENT

[gcode_macro FIRST_FLOOR_RESUME]
description: Resume the first floor print
gcode:
  RESTORE_E_CURRENT
  {% if printer['gcode_macro PRINTER_PARAM'].fan2_speed > 0 %}
    # {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
    # {action_respond_info("fan2_value2 = %s \n" % (fspeed))}
    # SET_PIN PIN=fan2 VALUE={(printer['gcode_macro PRINTER_PARAM'].fan2_speed * 255 + 0.5)|int}
    {% set s_value = (printer['gcode_macro PRINTER_PARAM'].fan2_speed * 255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) * 255 / (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min)|float %}
    M106 P2 S{s_value}
  {% endif %}
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float + 1.0 %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  M400
  RESUME_BASE {get_params}



[gcode_macro WAIT_PAUSE]
# change this if you need more or less extrusion
variable_extrude: 2.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro WAIT_PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 0.0 %}
  {% if act_z < 48.0 %}
    {% set z_safe = 50.0 - act_z %}
  {% elif act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% elif act_z < max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  {action_respond_info("z_safe = %s"% (z_safe))}
  ##### end of definitions #####
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
  # PAUSE_BASE
  G91
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE={printer.extruder.target}
  M104 S140
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z{z_safe} F600
    M400
    G90
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}
  # save fan2 value and turn off fan2
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan2_speed VALUE={printer['output_pin fan2'].value}
  {% set fspeed = printer['gcode_macro PRINTER_PARAM'].fan2_speed %}
  {action_respond_info("fan2_value = %s \n" % (fspeed))}
  # SET_PIN PIN=fan2 VALUE=0
  M106 P2 S0
  #SET_E_MIN_CURRENT 




